name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: builder
          POSTGRES_PASSWORD: builder
          POSTGRES_DB: builder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U builder" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: API tests again on PostgreSQL
        run: uv run pytest apps/api
        env:
          BUILDER_TEST_DATABASE_URL: postgresql+psycopg://builder:builder@localhost:5432/builder
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: uv sync --all-packages --all-groups
        working-directory: .
      - name: Generated API types are up to date
        run: npm run gen && git diff --exit-code src/api/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  qa:
    # Visual QA: every starter (plus awkward-content and right-to-left copies) at phone, tablet and
    # desktop widths. Fails on sideways scrolling and on axe accessibility violations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: uv sync --all-packages --all-groups
      - run: uv run python qa/build_sites.py qa/out
      - run: npm ci
        working-directory: qa
      - run: npx playwright-core install --with-deps chromium
        working-directory: qa
      - run: node check.mjs out shots
        working-directory: qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screenshots
          path: qa/shots
