[project]
name = "builder-api"
version = "0.0.0"
description = "FastAPI backend for the website builder"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "sitegen",
]

[tool.uv.sources]
sitegen = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
