server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # the browser only talks to this server: /api/* goes to the backend (prefix stripped)
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;   # image uploads (the API enforces its own 10 MB limit)
  }

  # single-page app: unknown paths serve index.html so client-side routes work on reload
  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
}
