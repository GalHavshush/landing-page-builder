[project]
name = "sitegen"
version = "0.0.0"
description = "Pure static-site generator: site document in, files out. No web or DB imports."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitegen"]
