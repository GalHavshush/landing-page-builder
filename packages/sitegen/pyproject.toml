[project]
name = "sitegen"
version = "0.0.0"
description = "Pure static-site generator: site document in, files out. No web or DB imports."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "nh3>=0.2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitegen"]
