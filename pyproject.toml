[project]
name = "landing-page-builder"
version = "0.0.0"
description = "Workspace root for the static website builder"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/sitegen"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages/sitegen/tests"]

[tool.ruff.lint.per-file-ignores]
"packages/sitegen/sitegen/icons.py" = ["E501"]
"packages/sitegen/sitegen/strings.py" = ["E501"]
